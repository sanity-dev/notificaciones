spring.application.name=microservicio-notificaciones
server.port=8085

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# La conexión a BBDD se toma del .env (NO TOCAR)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Seguridad JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Configuración SMTP (Email)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del Frontend (para links de recuperación)
app.frontend.url=http://localhost:4200

# URL del API Gateway (para comunicación con otros microservicios)
app.api-gateway.url=http://localhost:8080

# URL directa de Euphoria (fallback si el gateway no está disponible)
app.euphoria.url=http://localhost:5000