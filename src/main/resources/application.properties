spring.application.name=microservicio-notificaciones
server.port=8085

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# La conexión a BBDD se toma del .env (NO TOCAR)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Seguridad JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Azure Communication Services (Email)
azure.communication.connection-string=${ACS_CONNECTION_STRING}
azure.communication.sender-email=${ACS_SENDER_EMAIL}

# URL del Frontend (para links de recuperación)
app.frontend.url=http://localhost:4200